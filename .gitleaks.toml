title = "github.com/lopes canonical gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "url-query-api-key"
description = "High-entropy API key or token passed via URL query parameter"
regex = '''[?&](?i:(?:api_?key|key|token|access_token|auth_token|license_key|secret))=([A-Za-z0-9._~+-]{16,128})'''
secretGroup = 1
entropy = 3.2
keywords = [
  "key=",
  "api_key=",
  "apikey=",
  "token=",
  "access_token=",
  "auth_token=",
  "license_key=",
  "secret=",
]

  [rules.allowlist]
  description = "Ignore explicit RFC/synthetic test placeholders"
  regexTarget = "secret"
  regexes = [
    '''(?i)^SYNTHETIC_TEST_[A-Z0-9_]+$''',
    '''(?i)^REDACTED$''',
    '''(?i)^EXAMPLE_[A-Z0-9_]+$''',
    '''(?i)^DUMMY_[A-Z0-9_]+$''',
    '''(?i)^YOUR_[A-Z0-9_]+$''',
    '''(?i)^test-only-[a-z0-9-]+$''',
  ]

# Intentionally NO global path exclusions for tests/, spec/, fixtures/, docs/, or lockfiles
# (uv.lock, poetry.lock, Cargo.lock, package-lock.json, pnpm-lock.yaml):
# 1. Unit test fixtures copied from live runtime logs are a primary AI agent leak vector.
# 2. Lockfiles generated on developer workstations can embed private mirror URLs or basic-auth tokens.
