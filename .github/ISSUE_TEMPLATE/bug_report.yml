name: Bug Report
description: "Report a false positive, scanner failure, or workflow defect in the shared security pipeline"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a defect, regression, or unexpected behavior in dandye/lopes__.github.
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      options:
        - "Gitleaks Secret Scanning (.gitleaks.toml, prepare_gitleaks_config.py, scan_secrets.sh)"
        - "Opengrep SAST Scanning (security.yml, format_opengrep_findings.py)"
        - "Trivy Vulnerability & IaC Scanning (security.yml)"
        - "Security Policy & Documentation (SECURITY.md, README.md)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: Clear and concise description of what is broken.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, inputs, or steps that trigger the issue.
      placeholder: |
        1. Trigger `.github/workflows/security.yml` or `./scripts/scan_secrets.sh`
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted Terminal Output / Error Logs
      description: Paste relevant redacted terminal output or stack trace here (never paste raw credentials).
      render: shell
