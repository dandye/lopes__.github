---
name: Security Guardrails

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Pinned gitleaks release version"
        required: false
        type: string
        default: "8.30.1"
      trivy_severity:
        description: "Trivy severity threshold for failing builds"
        required: false
        type: string
        default: "CRITICAL,HIGH"
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # Weekly Monday 04:17 UTC

# Default deny-all GITHUB_TOKEN permissions; each job grants only contents: read.
permissions: {}

concurrency:
  group: security-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (gitleaks full history + working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full git history, no persisted credentials)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          path: repo

      - name: Checkout shared security baseline
        uses: actions/checkout@v6
        with:
          repository: lopes/.github
          persist-credentials: false
          path: baseline

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version || '8.30.1' }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history and working tree (including tests/)
        run: |
          set -euo pipefail
          if [ -f repo/.gitleaks.toml ]; then
            CONFIG_PATH="repo/.gitleaks.toml"
          else
            CONFIG_PATH="baseline/.gitleaks.toml"
          fi
          echo "Using gitleaks config: ${CONFIG_PATH}"

          IGNORE_ARGS=()
          if [[ -f repo/.gitleaksignore ]]; then
            IGNORE_ARGS=(--gitleaks-ignore-path repo/.gitleaksignore)
          fi

          gitleaks git repo \
            --config "${CONFIG_PATH}" \
            "${IGNORE_ARGS[@]}" \
            --redact=100 \
            --no-banner \
            --verbose \
            --exit-code 1

          gitleaks dir repo \
            --config "${CONFIG_PATH}" \
            "${IGNORE_ARGS[@]}" \
            --redact=100 \
            --no-banner \
            --exit-code 1

  opengrep:
    name: SAST (opengrep multi-language, redacted logs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          path: repo

      - name: Checkout shared security baseline
        uses: actions/checkout@v6
        with:
          repository: lopes/.github
          persist-credentials: false
          path: baseline

      - name: Install opengrep static binary
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/opengrep/opengrep/releases/latest/download/opengrep_manylinux_x86" -o /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      - name: Fetch open-source community rule packs
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/semgrep/semgrep-rules.git /tmp/opengrep-rules
          git -C /tmp/opengrep-rules sparse-checkout set \
            python/lang/security \
            bash/lang/security \
            rust/lang/security \
            terraform/lang/security \
            yaml/github-actions/security
          find /tmp/opengrep-rules -type f \( -name '*.test.yaml' -o -name '*.test.yml' -o ! -name '*.yaml' -a ! -name '*.yml' \) -delete

      - name: Run opengrep SAST (snippet-redacted output, including tests/)
        working-directory: repo
        run: |
          set -euo pipefail
          # Opengrep ships a compiled-in default .semgrepignore that skips
          # tests/ even when the repository has no .semgrepignore file.
          # Provide an explicit ignore list so tests/ is actually scanned.
          cat > /tmp/opengrep.ignore <<'EOF'
          .git/
          node_modules/
          .venv/
          venv/
          target/
          __pycache__/
          EOF

          set +e
          opengrep scan \
            --experimental \
            --semgrepignore-filename /tmp/opengrep.ignore \
            --config /tmp/opengrep-rules/python/lang/security \
            --config /tmp/opengrep-rules/bash/lang/security \
            --config /tmp/opengrep-rules/rust/lang/security \
            --config /tmp/opengrep-rules/terraform/lang/security \
            --config /tmp/opengrep-rules/yaml/github-actions/security \
            --severity ERROR \
            --error \
            --json \
            . > /tmp/opengrep-results.json
          SCAN_RC=$?
          set -e

          # Prefer the baseline's formatter; fall back to the repository's own copy
          # until this script has landed on the baseline's default branch.
          FORMATTER="../baseline/scripts/format_opengrep_findings.py"
          if [[ ! -f "$FORMATTER" && -f scripts/format_opengrep_findings.py ]]; then
            FORMATTER="scripts/format_opengrep_findings.py"
          fi
          python3 "$FORMATTER" /tmp/opengrep-results.json
          FORMAT_RC=$?
          rm -f /tmp/opengrep-results.json
          if [[ "$SCAN_RC" -ne 0 || "$FORMAT_RC" -ne 0 ]]; then
            exit 1
          fi

  trivy:
    name: IaC & Supply Chain (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: ${{ inputs.trivy_severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          exit-code: "1"
