---
name: Security Guardrails

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Pinned gitleaks release version (requires matching gitleaks_sha256 if overridden)"
        required: false
        type: string
        default: "8.30.1"
      gitleaks_sha256:
        description: "Expected SHA-256 hex digest for gitleaks_<version>_linux_x64.tar.gz"
        required: false
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      trivy_severity:
        description: "Trivy severity threshold for failing builds"
        required: false
        type: string
        default: "CRITICAL,HIGH"
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # Weekly Monday 04:17 UTC

# Default deny-all GITHUB_TOKEN permissions; each job grants only contents: read.
permissions: {}

concurrency:
  group: security-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (gitleaks full history + working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Resolve immutable baseline repository and ref
        id: baseline_meta
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          wf_ref = os.environ.get("WORKFLOW_REF", "")
          # Format: owner/repo/.github/workflows/security.yml@<ref>
          m = re.match(r"^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/[^@]+@(.+)$", wf_ref)
          if m and m.group(1) != os.environ["CURRENT_REPO"]:
              repo, ref = m.group(1), m.group(2)
          else:
              repo, ref = os.environ["CURRENT_REPO"], os.environ["CURRENT_SHA"]
          if not re.match(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", repo):
              raise SystemExit(f"Invalid baseline repository: {repo!r}")
          if not re.match(r"^[A-Za-z0-9_./-]+$", ref):
              raise SystemExit(f"Invalid baseline ref: {ref!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"repository={repo}\n")
              out.write(f"ref={ref}\n")
          PY

      - name: Checkout repository (full git history, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: repo

      - name: Checkout canonical security baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.baseline_meta.outputs.repository }}
          ref: ${{ steps.baseline_meta.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Install SHA256-verified gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version || '8.30.1' }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks_sha256 || '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' }}
        run: |
          set -euo pipefail
          if [[ ! "$GITLEAKS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid gitleaks_version format: ${GITLEAKS_VERSION}" >&2
            exit 1
          fi
          if [[ ! "$GITLEAKS_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid gitleaks_sha256 digest: ${GITLEAKS_SHA256}" >&2
            exit 1
          fi
          if [[ "$GITLEAKS_VERSION" != "8.30.1" && "$GITLEAKS_SHA256" == "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" ]]; then
            echo "ERROR: Overriding gitleaks_version requires providing the matching gitleaks_sha256." >&2
            exit 1
          fi

          ARCHIVE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$ARCHIVE_URL" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks.tar.gz /tmp/gitleaks
          gitleaks version

      - name: Scan full git history and working tree (including tests/)
        run: |
          set -euo pipefail
          if [ -f repo/.gitleaks.toml ]; then
            CONFIG_PATH="repo/.gitleaks.toml"
          else
            CONFIG_PATH="baseline/.gitleaks.toml"
          fi
          echo "Using gitleaks config: ${CONFIG_PATH}"

          IGNORE_ARGS=()
          if [[ -f repo/.gitleaksignore ]]; then
            IGNORE_ARGS=(--gitleaks-ignore-path repo/.gitleaksignore)
          fi

          gitleaks git repo \
            --config "${CONFIG_PATH}" \
            "${IGNORE_ARGS[@]}" \
            --redact=100 \
            --no-banner \
            --verbose \
            --exit-code 1

          gitleaks dir repo \
            --config "${CONFIG_PATH}" \
            "${IGNORE_ARGS[@]}" \
            --redact=100 \
            --no-banner \
            --exit-code 1

  opengrep:
    name: SAST (opengrep multi-language, redacted logs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve immutable baseline repository and ref
        id: baseline_meta
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          wf_ref = os.environ.get("WORKFLOW_REF", "")
          # Format: owner/repo/.github/workflows/security.yml@<ref>
          m = re.match(r"^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/[^@]+@(.+)$", wf_ref)
          if m and m.group(1) != os.environ["CURRENT_REPO"]:
              repo, ref = m.group(1), m.group(2)
          else:
              repo, ref = os.environ["CURRENT_REPO"], os.environ["CURRENT_SHA"]
          if not re.match(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", repo):
              raise SystemExit(f"Invalid baseline repository: {repo!r}")
          if not re.match(r"^[A-Za-z0-9_./-]+$", ref):
              raise SystemExit(f"Invalid baseline ref: {ref!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"repository={repo}\n")
              out.write(f"ref={ref}\n")
          PY

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          path: repo

      - name: Checkout canonical security baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.baseline_meta.outputs.repository }}
          ref: ${{ steps.baseline_meta.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Install SHA256- and Cosign-verified opengrep
        env:
          OPENGREP_VERSION: "v1.33.1"
          OPENGREP_SHA256: "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808"
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE_URL}/opengrep_manylinux_x86" -o /tmp/opengrep
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE_URL}/opengrep_manylinux_x86.cert" -o /tmp/opengrep.cert
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE_URL}/opengrep_manylinux_x86.sig" -o /tmp/opengrep.sig

          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -

          if command -v cosign >/dev/null 2>&1; then
            cosign verify-blob /tmp/opengrep \
              --certificate /tmp/opengrep.cert \
              --signature /tmp/opengrep.sig \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github\.com/opengrep/opengrep/\.github/workflows/.*@refs/heads/release-${OPENGREP_VERSION}$"
          fi

          sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep
          rm -f /tmp/opengrep /tmp/opengrep.cert /tmp/opengrep.sig
          opengrep --version

      - name: Fetch open-source community rule packs
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/semgrep/semgrep-rules.git /tmp/opengrep-rules
          git -C /tmp/opengrep-rules sparse-checkout set \
            python/lang/security \
            bash/lang/security \
            rust/lang/security \
            terraform/lang/security \
            yaml/github-actions/security
          find /tmp/opengrep-rules -type f \( -name '*.test.yaml' -o -name '*.test.yml' -o ! -name '*.yaml' -a ! -name '*.yml' \) -delete

      - name: Run opengrep SAST (snippet-redacted output, including tests/)
        working-directory: repo
        run: |
          set -euo pipefail
          # Opengrep ships a compiled-in default .semgrepignore that skips
          # tests/ even when the repository has no .semgrepignore file.
          # Provide an explicit ignore list so tests/ is actually scanned.
          cat > /tmp/opengrep.ignore <<'EOF'
          .git/
          node_modules/
          .venv/
          venv/
          target/
          __pycache__/
          EOF

          set +e
          opengrep scan \
            --experimental \
            --semgrepignore-filename /tmp/opengrep.ignore \
            --config /tmp/opengrep-rules/python/lang/security \
            --config /tmp/opengrep-rules/bash/lang/security \
            --config /tmp/opengrep-rules/rust/lang/security \
            --config /tmp/opengrep-rules/terraform/lang/security \
            --config /tmp/opengrep-rules/yaml/github-actions/security \
            --severity ERROR \
            --error \
            --json \
            . > /tmp/opengrep-results.json
          SCAN_RC=$?
          set -e

          # Prefer the baseline's formatter; fall back to the repository's own copy
          # until this script has landed on the baseline's default branch.
          FORMATTER="../baseline/scripts/format_opengrep_findings.py"
          if [[ ! -f "$FORMATTER" && -f scripts/format_opengrep_findings.py ]]; then
            FORMATTER="scripts/format_opengrep_findings.py"
          fi
          python3 "$FORMATTER" /tmp/opengrep-results.json
          FORMAT_RC=$?
          rm -f /tmp/opengrep-results.json
          if [[ "$SCAN_RC" -ne 0 || "$FORMAT_RC" -ne 0 ]]; then
            exit 1
          fi

  trivy:
    name: IaC & Supply Chain (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: ${{ inputs.trivy_severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          exit-code: "1"
